version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: incident-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: incidentlog

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  app:
    build:
      context: .

    container_name: incident-app
    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      - postgres

    env_file:
      - .env


volumes:
  postgres_data:



